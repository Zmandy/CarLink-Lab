<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CarLink 车载桌面</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:system-ui,"Noto Sans SC",sans-serif;color:#f1f5fa;background:#0b111d;font-size:1.6vw}
.shell{height:100%;padding:3vh 3vw;display:flex;flex-direction:column;gap:3vh;background:radial-gradient(ellipse at 80% 10%,#243950 0,transparent 65%)}
header{display:flex;align-items:center;justify-content:space-between;min-height:9vh;gap:2vw}
.brand{letter-spacing:.15em;font-size:1.3vw;color:#a5bacd}.welcome{font-size:2.5vw;max-width:60vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clock{text-align:right;font-size:3.2vw;font-variant-numeric:tabular-nums;line-height:1.1}.date{font-size:1.2vw;color:#9bb0c5;margin-top:.6vh}
main{display:grid;grid-template-columns:1.12fr 1fr;gap:2vw;flex:1;min-height:0}
.card{border:1px solid #34485e;border-radius:2vw;background:#142132cc;overflow:hidden;padding:2.4vh 2.2vw}
.section{font-size:1.6vw;color:#b6c7d9}.nav{display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(140deg,#213b55,#122034)}
.navicon{width:7vw;height:7vw;color:#90cfff}.nav h1{font-size:3.4vw;font-weight:500;margin:1vh 0}.nav p{color:#b4c6d9;font-size:1.5vw;line-height:1.8;margin:0}
.badge{display:inline-block;font-size:1.2vw;background:#263c52;color:#bdd6ed;padding:1vh 1vw;border-radius:4vw;margin-top:2vh}
.vehicle{display:flex;flex-direction:column}.vehiclehead{display:flex;justify-content:space-between;align-items:center}.speed{font-size:2.4vw;font-variant-numeric:tabular-nums}.unit{font-size:1.1vw;color:#9bb0c5}
.tires{display:grid;grid-template-columns:1fr 5vw 1fr;grid-template-rows:1fr 1fr;gap:2vh 1.5vw;flex:1;align-items:center;padding-top:2vh}
.tire{background:#0c1725;border-radius:1vw;padding:1.6vh 1.3vw}.label{color:#9db2c7;font-size:1.2vw}.pressure{font-size:2.7vw;font-variant-numeric:tabular-nums;margin-top:.5vh}.temp{font-size:1.2vw;color:#a9bed1}
.car{grid-column:2;grid-row:1/3;width:5vw;height:100%;max-height:27vh;align-self:center;color:#829bb1}
.waiting{font-size:1.2vw;color:#a9bed1;margin-top:1.5vh;white-space:nowrap}
footer{color:#8fa5ba;font-size:1.15vw;display:flex;justify-content:space-between;min-height:3vh}
@media (orientation:portrait){main{grid-template-columns:1fr;grid-template-rows:.8fr 1.2fr}.welcome{font-size:4vw}.clock{font-size:5vw}.section,.nav p{font-size:2.7vw}.nav h1{font-size:5vw}.navicon{width:8vw;height:8vw}.label,.temp,.waiting,.badge{font-size:2.2vw}.pressure{font-size:4.5vw}.brand,.date,footer{font-size:2vw}.car{max-height:19vh}.speed{font-size:4vw}.unit{font-size:2vw}}
</style>
</head>
<body><div class="shell">
<header><div><div class="brand">CARLINK</div><div class="welcome" id="title">欢迎上车</div></div><div class="clock"><span id="clock">--:--:--</span><div class="date" id="date"></div></div></header>
<main>
<section class="card nav"><div class="section">导航</div><div>
<svg class="navicon" viewBox="0 0 80 80" fill="none" aria-hidden="true"><path d="M40 8 66 68 40 54 14 68Z" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/><path d="M40 23V49" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
<h1>下一程，即将开启</h1><p>在手机打开高德独立导航<br>搜索目的地，开始新的旅程</p><span class="badge">高德独立导航</span>
</div><div class="section">车载桌面</div></section>
<section class="card vehicle"><div class="vehiclehead"><span class="section">车辆状态</span><span><span class="speed" id="speed">--</span> <span class="unit">km/h</span></span></div>
<div class="tires">
<div class="tire"><div class="label">左前</div><div class="pressure"><span id="p0">--</span><span class="unit"> kPa</span></div><div class="temp" id="t0">-- °C</div></div>
<svg class="car" viewBox="0 0 80 180" fill="none" aria-hidden="true"><rect x="13" y="5" width="54" height="170" rx="22" stroke="currentColor" stroke-width="2"/><path d="M22 50Q40 40 58 50L61 77H19ZM19 116H61L57 144Q40 152 23 144Z" fill="#344f65" stroke="currentColor"/><path d="M16 82V111M64 82V111" stroke="currentColor" stroke-width="2"/></svg>
<div class="tire"><div class="label">右前</div><div class="pressure"><span id="p1">--</span><span class="unit"> kPa</span></div><div class="temp" id="t1">-- °C</div></div>
<div class="tire"><div class="label">左后</div><div class="pressure"><span id="p2">--</span><span class="unit"> kPa</span></div><div class="temp" id="t2">-- °C</div></div>
<div class="tire"><div class="label">右后</div><div class="pressure"><span id="p3">--</span><span class="unit"> kPa</span></div><div class="temp" id="t3">-- °C</div></div>
</div><div class="waiting" id="vehicleStatus">等待车辆数据</div></section>
</main>
<footer><span>独立车载画面</span><span>可在手机切换画面</span></footer>
</div><script>
window.updateDashboard=function(data){
 const text=(id,value)=>document.getElementById(id).textContent=value;
 text('title',data.title||'欢迎上车');text('clock',data.clock||'--:--:--');text('date',data.date||'');
 text('speed',Number.isFinite(data.speed)?Math.round(data.speed):'--');
 const tires=Array.isArray(data.tires)?data.tires:[];
 for(let i=0;i<4;i++){const tire=tires[i]||[];text('p'+i,Number.isFinite(tire[0])?Math.round(tire[0]):'--');text('t'+i,(Number.isFinite(tire[1])?Math.round(tire[1]):'--')+' °C');}
 text('vehicleStatus',tires.length?'车辆数据已更新':'等待车辆数据');
};
</script></body></html>
